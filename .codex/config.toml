[mcp_servers.dona_slack]
command = "node"
args = ["dist/mcp/index.js"]
cwd = "sources/slack"
enabled = true
required = false
enabled_tools = ["list_workspaces", "list_channels", "get_channel", "check_user_channel_access", "list_users", "get_user", "get_thread", "get_reactions", "get_file", "set_agent_session_status", "post_message", "add_reaction"]
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 150

[mcp_servers.dona_dispatcher]
command = "node"
args = ["dist/mcp/index.js"]
cwd = "dispatcher"
enabled = true
required = false
enabled_tools = ["delegate_task", "control_task_continuation", "get_task", "find_issue_task", "inspect_task_recovery", "reconcile_task_result", "get_task_questions", "answer_task_question", "respond_task_approval", "list_tasks", "pause_task", "resume_task", "cancel_task", "steer_task", "retry_task", "preview_schedule", "create_schedule", "get_schedule", "list_schedules", "update_schedule", "pause_schedule", "resume_schedule", "cancel_schedule", "get_schedule_history", "delegate_job", "delegate_scheduled_work", "list_event_jobs", "list_thread_jobs", "list_owner_jobs", "get_job_status_summary", "get_job_status", "authorize_job_notification", "record_schedule_job_access", "steer_job", "cancel_job", "plan_self_update", "apply_self_update", "get_self_update_status", "cancel_self_update"]
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 150
